<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Collect - Dashibodi</title>
  <script type="module" src="./scripts/dashboard.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-700 text-white p-4 flex justify-between items-center shadow">
    <h1 class="text-lg font-bold">Smart Collect</h1>
    <button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700 transition">
      Toka
    </button>
  </header>

  <!-- Main Content -->
  <main class="p-4 w-full max-w-4xl mx-auto flex-grow">
    
    <!-- Button to add new contribution -->
    <div class="mb-6 flex justify-between items-center">
      <h2 class="text-xl font-semibold">Michango Yangu</h2>
      <button id="newContributionBtn" class="bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 transition">
        + Mchango Mpya
      </button>
    </div>

    <!-- List of Contributions -->
    <div id="contributionsList" class="space-y-4">
      <p class="text-gray-600 text-sm">Inapakia michango...</p>
    </div>

  </main>

  <!-- Footer (optional) -->
  <footer class="text-center text-gray-500 text-sm py-4">
    &copy; 2025 Smart Collect - Mfumo wa Michango
  </footer>

</body>
</html>
